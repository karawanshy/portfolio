    <!-- Marks JS as available before first paint; no-JS fallbacks key off html:not(.js).
         A reload starts the page over at the top: the hash is dropped before the browser can
         scroll to it (router.ts installHistory then keeps it at the top). -->
    <script>
      document.documentElement.classList.add('js');
      (function () {
        var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
        if (!nav || nav.type !== 'reload') return;
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        history.replaceState(null, '', location.pathname + location.search);
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
